name: Deploy Client to S3 and CloudFront
run-name: Deploy Client to S3 and CloudFront (${{ github.sha }})

on:
  push:
    branches:
      - main
    paths:
      - "client/**"
      - ".github/workflows/deploy-client.yml"
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-2
  S3_BUCKET: teacher-bo-production
  S3_PREFIX: client-build
  CLOUDFRONT_DISTRIBUTION_ID: E2QWFNXPUVRKJE
  CLIENT_PUBLIC_URL: ${{ vars.CLIENT_PUBLIC_URL || 'https://teacher-bo.leed.at' }}
  CLIENT_PUBLIC_API_URL: ${{ vars.CLIENT_PUBLIC_API_URL || 'https://b92c_b9ejghdi28.leed.at' }}
  CLIENT_PUBLIC_SOCKET_URL: ${{ vars.CLIENT_PUBLIC_SOCKET_URL || vars.CLIENT_PUBLIC_URL || 'https://teacher-bo.leed.at' }}

jobs:
  deploy-client:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: |
          cd client
          echo "📦 Installing dependencies..."
          yarn install --frozen-lockfile
          echo "✅ Dependencies installed"

      - name: Create .env file
        env:
          CLIENT_ENV: ${{ secrets.CLIENT_ENV }}
        run: |
          cd client
          : > .env
          if [ -n "$CLIENT_ENV" ]; then
            printf "%s\n" "$CLIENT_ENV" >> .env
          fi
          {
            echo "EXPO_PUBLIC_URL=${{ env.CLIENT_PUBLIC_URL }}"
            echo "EXPO_PUBLIC_API_URL=${{ env.CLIENT_PUBLIC_API_URL }}"
            echo "EXPO_PUBLIC_SOCKET_URL=${{ env.CLIENT_PUBLIC_SOCKET_URL }}"
          } >> .env
          echo "✅ .env file created"

      - name: Export web build
        run: |
          cd client
          echo "🔨 Exporting web build..."
          yarn export:web
          echo "✅ Web build exported"
          ls -la dist/

      - name: Upload to S3
        run: |
          echo "📤 Uploading to S3 bucket: ${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}/..."
          aws s3 sync client/dist/ s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "*.json"

          # Upload HTML and JSON files with different cache settings
          aws s3 sync client/dist/ s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}/ \
            --exclude "*" \
            --include "*.html" \
            --include "*.json" \
            --cache-control "public, max-age=0, must-revalidate"

          echo "✅ Upload to S3 completed"

      - name: Create CloudFront invalidation
        id: cloudfront
        run: |
          echo "🔄 Creating CloudFront invalidation..."
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          echo "✅ Invalidation created: ${INVALIDATION_ID}"

          echo "distribution_id=${{ env.CLOUDFRONT_DISTRIBUTION_ID }}" >> $GITHUB_OUTPUT
          echo "invalidation_id=${INVALIDATION_ID}" >> $GITHUB_OUTPUT

      - name: Wait for invalidation
        run: |
          echo "⏳ Waiting for CloudFront invalidation to complete..."
          aws cloudfront wait invalidation-completed \
            --distribution-id ${{ steps.cloudfront.outputs.distribution_id }} \
            --id ${{ steps.cloudfront.outputs.invalidation_id }}
          echo "✅ Invalidation completed"

      - name: Verify deployed client assets
        run: |
          node <<'NODE'
          const baseUrl = process.env.CLIENT_PUBLIC_URL.replace(/\/$/, "");
          const routeBodies = [];

          for (const route of ["/", "/test"]) {
            const response = await fetch(`${baseUrl}${route}`, { cache: "no-store" });

            if (!response.ok) {
              throw new Error(`Client route failed ${route}: ${response.status} ${response.statusText}`);
            }

            routeBodies.push(await response.text());
          }

          const refs = routeBodies
            .flatMap((html) => [...html.matchAll(/(?:src|href)="([^"]+)"/g)])
            .map((match) => match[1])
            .filter((href) => href.startsWith("/_expo/") || href === "/favicon.ico");
          const assetUrls = [...new Set(refs.map((href) => new URL(href, baseUrl).toString()))];

          if (!assetUrls.some((url) => url.endsWith(".js"))) {
            throw new Error("No deployed JavaScript bundle reference found in index.html");
          }

          const failures = [];

          for (const url of assetUrls) {
            const response = await fetch(url, { method: "HEAD", cache: "no-store" });

            if (!response.ok) {
              failures.push(`${response.status} ${url}`);
            }
          }

          if (failures.length > 0) {
            throw new Error(`Deployed asset verification failed:\n${failures.join("\n")}`);
          }

          console.log(`✅ Verified ${assetUrls.length} deployed client assets`);
          NODE

      - name: Get CloudFront domain
        id: domain
        run: |
          DOMAIN=$(aws cloudfront get-distribution \
            --id ${{ steps.cloudfront.outputs.distribution_id }} \
            --query "Distribution.DomainName" \
            --output text)

          echo "domain=${DOMAIN}" >> $GITHUB_OUTPUT

      - name: Deployment summary
        if: success()
        run: |
          echo "========================================="
          echo "🎉 Client Deployment Successful!"
          echo "========================================="
          echo "S3 Path: s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}/"
          echo "CloudFront Distribution: ${{ steps.cloudfront.outputs.distribution_id }}"
          echo "Domain: https://${{ steps.domain.outputs.domain }}"
          echo "Invalidation: ${{ steps.cloudfront.outputs.invalidation_id }}"
          echo "========================================="
