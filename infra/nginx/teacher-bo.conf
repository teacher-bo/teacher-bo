map $http_upgrade $teacher_bo_connection_upgrade {
    default upgrade;
    "" close;
}

map $http_origin $teacher_bo_cors_origin {
    default "";
    "https://teacher-bo.leed.at" $http_origin;
    "https://dhtb31jlmkwpp.cloudfront.net" $http_origin;
}

upstream teacher_bo_server {
    server localhost:8095;
    keepalive 32;
}

server {
    listen 80;
    server_name b92c_b9ejghdi28.leed.at;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name b92c_b9ejghdi28.leed.at;

    ssl_certificate /etc/letsencrypt/live/leed/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/leed/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 80m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;

    add_header Access-Control-Allow-Origin $teacher_bo_cors_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Expose-Headers "x-version-mismatch, x-server-version" always;

    location ^~ /socket.io {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $teacher_bo_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://teacher_bo_server;
    }

    location ^~ /api/socket.io {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $teacher_bo_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://teacher_bo_server/socket.io;
    }

    location ^~ /api/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $teacher_bo_cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, x-device-fingerprint, x-client-version, x-platform, Apollo-Require-Preflight" always;
            add_header Content-Length 0;
            return 204;
        }

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass http://teacher_bo_server;
    }

    location = /health {
        proxy_pass http://teacher_bo_server/health;
    }

    location / {
        return 404;
    }
}
